{% extends "base.html" %}

{% block title %}Register New Account — Railway Reservation System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">

    <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-xl font-bold mb-2">
                ✍️
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Create an Account</h1>
            <p class="text-xs text-slate-500 mt-1">Register to start reserving train tickets.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label for="full_name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Full Name
                </label>
                <input type="text" id="full_name" name="full_name" required placeholder="e.g. Rahul Sharma"
                       value="{{ request.form.get('full_name', '') }}"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-slate-50 hover:bg-white transition">
            </div>

            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Email Address
                </label>
                <input type="email" id="email" name="email" required placeholder="name@example.com"
                       value="{{ request.form.get('email', '') }}"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-slate-50 hover:bg-white transition">
            </div>

            <div>
                <label for="phone" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Mobile Phone Number
                </label>
                <input type="tel" id="phone" name="phone" required placeholder="e.g. 9876543210" maxlength="15"
                       value="{{ request.form.get('phone', '') }}"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-slate-50 hover:bg-white transition">
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Password (Min 6 Characters)
                </label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-slate-50 hover:bg-white transition">
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                    Confirm Password
                </label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none bg-slate-50 hover:bg-white transition">
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-sm rounded-lg shadow-md hover:shadow-lg transition">
                Create Account
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
            Already have an account?
            <a href="{{ url_for('login') }}" class="font-bold text-sky-600 hover:text-sky-800">Sign in here</a>
        </div>
    </div>

</div>
{% endblock %}
